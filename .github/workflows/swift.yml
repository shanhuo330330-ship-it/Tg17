name: Build iOS App

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        id: prep
        run: |
          set -e
          shopt -s nullglob
          for z in *.zip; do unzip -oq "$z" -d "_x_$(basename "$z" .zip)"; done
          PROJECT=$(find . -name "*.xcodeproj" -not -path "*/.git/*" | head -1)
          if [ -z "$PROJECT" ]; then
            echo "::error::找不到 .xcodeproj，确认压缩包或工程文件已上传"
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          if xcodebuild -list -project "$PROJECT" 2>/dev/null | grep -q "Schemes:"; then
            MODE=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{f=1;next} f&&NF{print "-scheme "$1; exit}')
          else
            MODE=$(xcodebuild -list -project "$PROJECT" | awk '/Targets:/{f=1;next} f&&NF{print "-target "$1; exit}')
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "工程: $PROJECT / 编译方式: $MODE"

      - name: Build simulator
        run: |
          set -o pipefail
          xcodebuild -project "${{ steps.prep.outputs.project }}" ${{ steps.prep.outputs.mode }} -sdk iphonesimulator -configuration Release -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -60

      - name: Build device
        run: |
          set -o pipefail
          xcodebuild -project "${{ steps.prep.outputs.project }}" ${{ steps.prep.outputs.mode }} -sdk iphoneos -configuration Release -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tail -60

      - name: Pack ipa
        run: |
          set -e
          APP=$(find build/device -name "*.app" | head -1)
          SAPP=$(find build/sim -name "*.app" | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr ProxyProfileDemo-unsigned.ipa Payload
          zip -qr ProxyProfileDemo-simulator-app.zip "$SAPP"

      - uses: actions/upload-artifact@v4
        with:
          name: ProxyProfileDemo-iOS
          path: |
            ProxyProfileDemo-unsigned.ipa
            ProxyProfileDemo-simulator-app.zip
          retention-days: 30
