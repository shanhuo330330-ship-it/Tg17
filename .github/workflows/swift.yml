name: Build iOS App

on:
  push:
    branches: [ main, master, "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-extract any zip in repo root
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "发现压缩包: $z，正在解压..."
            unzip -o "$z" -d "_extracted_$(basename "$z" .zip)"
          done
          find . -maxdepth 3 -not -path "*/.git/*" | sort

      - name: Locate the .xcodeproj
        id: locate
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" -not -path "*/.git/*" | head -1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "::error::找不到 .xcodeproj，请确认项目已上传（可以在压缩包里）。"
            exit 1
          fi
          SCHEME=$(basename "$PROJECT_PATH" .xcodeproj)
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.*.app || true

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project "${{ steps.locate.outputs.project_path }}" \
            -scheme "${{ steps.locate.outputs.scheme }}" \
            -sdk iphonesimulator -configuration Release \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Build for iOS Device (unsigned)
        run: |
          xcodebuild -project "${{ steps.locate.outputs.project_path }}" \
            -scheme "${{ steps.locate.outputs.scheme }}" \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -40

      - name: Pack unsigned .ipa
        run: |
          APP_PATH=$(find build/device -name "*.app" -maxdepth 5 | head -1)
          SIM_APP_PATH=$(find build/sim -name "*.app" -maxdepth 5 | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ProxyProfileDemo-unsigned.ipa Payload
          zip -r ProxyProfileDemo-simulator-app.zip "$SIM_APP_PATH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProxyProfileDemo-iOS
          path: |
            ProxyProfileDemo-unsigned.ipa
            ProxyProfileDemo-simulator-app.zip
          retention-days: 30
